name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to notify
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release-api:
    name: Release API (Cloudflare Workers)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release-web:
    name: Release Web (Cloudflare Pages)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.RELEASE_TAG }}
      - run: npx wrangler pages deploy dist --project-name=mineard-web --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  create-release:
    name: Create GitHub Release and notify Discord
    runs-on: ubuntu-latest
    needs: [release-api, release-web]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (needs.release-api.result == 'success' && needs.release-web.result == 'success')) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Create or reuse GitHub Release
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            NOTES=$(gh release view "$RELEASE_TAG" --json body --jq '.body')
          else
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${RELEASE_TAG}$" | head -1)
            if [ -z "$PREV_TAG" ]; then
              git log --format='- %s' "$RELEASE_TAG" > changelog.md
            else
              git log --format='- %s' "${PREV_TAG}..${RELEASE_TAG}" > changelog.md
            fi
            gh release create "$RELEASE_TAG" --notes-file changelog.md --title "$RELEASE_TAG"
            NOTES=$(<changelog.md)
          fi

          TRUNCATED="${NOTES:0:1500}"
          if [ "${#NOTES}" -gt 1500 ]; then
            TRUNCATED="${TRUNCATED}..."
          fi
          {
            echo 'notes<<EOF'
            echo "$TRUNCATED"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
          status: success
          title: Release ${{ env.RELEASE_TAG }}
          description: ${{ steps.create-release.outputs.notes }}

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [release-api, release-web]
    if: ${{ always() && github.event_name == 'push' }}
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_GHA }}
          status: ${{ (needs.release-api.result == 'success' && needs.release-web.result == 'success') && 'success' || 'failure' }}
          title: Release ${{ env.RELEASE_TAG }}
