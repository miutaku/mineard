name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-api:
    name: Check API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run
      - name: Verify local Worker authentication
        run: |
          npx wrangler dev --local --port 8787 > /tmp/mineard-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /tmp/mineard-response.json -w '%{http_code}' http://127.0.0.1:8787/api/dashboard || true)
            if [ "$status" = "401" ]; then
              node -e 'const fs = require("node:fs"); const body = JSON.parse(fs.readFileSync("/tmp/mineard-response.json", "utf8")); if (body.error !== "Unauthorized") process.exit(1)'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mineard-worker.log
          exit 1

  check-web:
    name: Check Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [check-api, check-web]
    if: github.event_name == 'push' && always()
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_GHA }}
          status: ${{ (needs.check-api.result == 'success' && needs.check-web.result == 'success') && 'success' || 'failure' }}
